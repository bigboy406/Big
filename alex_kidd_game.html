<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Kidd Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(180deg, #87CEEB 0%, #98FB98 100%);
            font-family: 'Courier New', monospace;
            overflow: hidden;
            touch-action: none;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            background: linear-gradient(180deg, #87CEEB 0%, #98FB98 70%, #8B4513 70%, #228B22 100%);
            touch-action: none;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }

        #controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 10;
            pointer-events: none;
        }

        .control-btn {
            pointer-events: all;
            width: 75px;
            height: 75px;
            background: rgba(0,0,0,0.6);
            border: 4px solid rgba(255,255,255,0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            user-select: none;
            touch-action: manipulation;
            cursor: pointer;
            transition: all 0.1s ease;
            backdrop-filter: blur(5px);
        }

        .control-btn:active,
        .control-btn.pressed {
            background: rgba(255,255,255,0.8);
            color: #333;
            transform: scale(0.9);
            box-shadow: 0 0 25px rgba(255,255,255,0.8);
            border-color: #4CAF50;
        }

        #leftControls {
            display: flex;
            gap: 15px;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 20;
        }

        #gameOver h2 {
            margin-bottom: 15px;
            font-size: 24px;
        }

        #restartBtn {
            background: #FF6B6B;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        #restartBtn:active {
            background: #FF5252;
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div>Score: <span id="score">0</span></div>
            <div>Lives: <span id="lives">3</span></div>
            <div id="powerUpStatus" style="color: #FFD700; margin-top: 5px;"></div>
        </div>

        <div id="controls">
            <div id="leftControls">
                <div class="control-btn" id="leftBtn">←</div>
                <div class="control-btn" id="rightBtn">→</div>
            </div>
            <div class="control-btn" id="jumpBtn">⬆</div>
        </div>

        <div id="gameOver">
            <h2>Game Over!</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button id="restartBtn">Play Again</button>
        </div>
    </div>

    <script>
        class AudioManager {
            constructor() {
                this.audioContext = null;
                this.sounds = {};
                this.initialized = false;
            }

            async init() {
                if (this.initialized) return;
                
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.createSounds();
                    this.initialized = true;
                } catch (e) {
                    console.log('Audio not supported');
                }
            }

            createSounds() {
                // Jump sound
                this.sounds.jump = this.createTone(330, 0.2, 'triangle');
                
                // Collect sound
                this.sounds.collect = this.createTone(523, 0.3, 'sine');
                
                // Enemy hit sound
                this.sounds.hit = this.createTone(150, 0.5, 'sawtooth');
                
                // Power-up sound
                this.sounds.powerUp = this.createTone(440, 0.4, 'square');
                
                // Game over sound
                this.sounds.gameOver = this.createTone(100, 1.0, 'triangle');
            }

            createTone(frequency, duration, type = 'sine') {
                return () => {
                    if (!this.audioContext) return;
                    
                    const oscillator = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);
                    
                    oscillator.frequency.setValueAtTime(frequency, this.audioContext.currentTime);
                    oscillator.type = type;
                    
                    gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + duration);
                    
                    oscillator.start(this.audioContext.currentTime);
                    oscillator.stop(this.audioContext.currentTime + duration);
                };
            }

            play(soundName) {
                if (this.initialized && this.sounds[soundName]) {
                    try {
                        this.sounds[soundName]();
                    } catch (e) {
                        console.log('Sound playback failed:', e);
                    }
                }
            }
        }

        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.audioManager = new AudioManager();
                
                this.setupCanvas();
                this.setupControls();
                
                this.player = {
                    x: 100,
                    y: 400,
                    width: 32,
                    height: 32,
                    velX: 0,
                    velY: 0,
                    speed: 5,
                    jumpPower: 15,
                    onGround: false,
                    color: '#FF6B6B'
                };

                this.camera = { x: 0, y: 0 };
                this.score = 0;
                this.lives = 3;
                this.gameRunning = true;
                
                this.collectibles = [];
                this.enemies = [];
                this.platforms = [];
                this.powerUps = [];
                this.particles = [];
                this.playerPowerUp = null;
                this.powerUpTimer = 0;
                
                this.keys = {
                    left: false,
                    right: false,
                    jump: false
                };

                this.generateLevel();
                this.gameLoop();
            }

            setupCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                
                window.addEventListener('resize', () => {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                });
            }

            setupControls() {
                // Touch controls
                const leftBtn = document.getElementById('leftBtn');
                const rightBtn = document.getElementById('rightBtn');
                const jumpBtn = document.getElementById('jumpBtn');

                // Left button
                leftBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    this.keys.left = true;
                    leftBtn.classList.add('pressed');
                    this.initAudio();
                }, { passive: false });
                leftBtn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    this.keys.left = false;
                    leftBtn.classList.remove('pressed');
                }, { passive: false });
                leftBtn.addEventListener('touchcancel', (e) => {
                    this.keys.left = false;
                    leftBtn.classList.remove('pressed');
                });
                leftBtn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    this.keys.left = true;
                    leftBtn.classList.add('pressed');
                    this.initAudio();
                });
                leftBtn.addEventListener('mouseup', () => {
                    this.keys.left = false;
                    leftBtn.classList.remove('pressed');
                });
                leftBtn.addEventListener('mouseleave', () => {
                    this.keys.left = false;
                    leftBtn.classList.remove('pressed');
                });

                // Right button
                rightBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    this.keys.right = true;
                    rightBtn.classList.add('pressed');
                    this.initAudio();
                }, { passive: false });
                rightBtn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    this.keys.right = false;
                    rightBtn.classList.remove('pressed');
                }, { passive: false });
                rightBtn.addEventListener('touchcancel', (e) => {
                    this.keys.right = false;
                    rightBtn.classList.remove('pressed');
                });
                rightBtn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    this.keys.right = true;
                    rightBtn.classList.add('pressed');
                    this.initAudio();
                });
                rightBtn.addEventListener('mouseup', () => {
                    this.keys.right = false;
                    rightBtn.classList.remove('pressed');
                });
                rightBtn.addEventListener('mouseleave', () => {
                    this.keys.right = false;
                    rightBtn.classList.remove('pressed');
                });

                // Jump button
                jumpBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    this.keys.jump = true;
                    jumpBtn.classList.add('pressed');
                    this.initAudio();
                }, { passive: false });
                jumpBtn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    this.keys.jump = false;
                    jumpBtn.classList.remove('pressed');
                }, { passive: false });
                jumpBtn.addEventListener('touchcancel', (e) => {
                    this.keys.jump = false;
                    jumpBtn.classList.remove('pressed');
                });
                jumpBtn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    this.keys.jump = true;
                    jumpBtn.classList.add('pressed');
                    this.initAudio();
                });
                jumpBtn.addEventListener('mouseup', () => {
                    this.keys.jump = false;
                    jumpBtn.classList.remove('pressed');
                });
                jumpBtn.addEventListener('mouseleave', () => {
                    this.keys.jump = false;
                    jumpBtn.classList.remove('pressed');
                });

                // Keyboard controls
                document.addEventListener('keydown', (e) => {
                    this.initAudio();
                    switch(e.code) {
                        case 'ArrowLeft':
                        case 'KeyA':
                            this.keys.left = true;
                            break;
                        case 'ArrowRight':
                        case 'KeyD':
                            this.keys.right = true;
                            break;
                        case 'Space':
                        case 'ArrowUp':
                        case 'KeyW':
                            e.preventDefault();
                            this.keys.jump = true;
                            break;
                    }
                });

                document.addEventListener('keyup', (e) => {
                    switch(e.code) {
                        case 'ArrowLeft':
                        case 'KeyA':
                            this.keys.left = false;
                            break;
                        case 'ArrowRight':
                        case 'KeyD':
                            this.keys.right = false;
                            break;
                        case 'Space':
                        case 'ArrowUp':
                        case 'KeyW':
                            this.keys.jump = false;
                            break;
                    }
                });

                // Restart button
                document.getElementById('restartBtn').addEventListener('click', () => {
                    this.restart();
                });
            }

            async initAudio() {
                if (!this.audioManager.initialized) {
                    await this.audioManager.init();
                }
            }

            generateLevel() {
                // Ground platforms
                for (let i = 0; i < 50; i++) {
                    this.platforms.push({
                        x: i * 100,
                        y: this.canvas.height - 100,
                        width: 100,
                        height: 100,
                        color: '#8B4513'
                    });
                }

                // Floating platforms
                for (let i = 0; i < 20; i++) {
                    this.platforms.push({
                        x: 200 + i * 400 + Math.random() * 200,
                        y: 300 + Math.random() * 200,
                        width: 150,
                        height: 30,
                        color: '#654321'
                    });
                }

                // Collectibles
                for (let i = 0; i < 30; i++) {
                    this.collectibles.push({
                        x: 150 + i * 200 + Math.random() * 100,
                        y: 200 + Math.random() * 300,
                        width: 20,
                        height: 20,
                        collected: false,
                        color: '#FFD700'
                    });
                }

                // Enemies - different types
                for (let i = 0; i < 12; i++) {
                    const enemyType = Math.random();
                    let enemy;
                    
                    if (enemyType < 0.6) {
                        // Walker enemy
                        enemy = {
                            x: 300 + i * 400 + Math.random() * 200,
                            y: this.canvas.height - 130,
                            width: 24,
                            height: 24,
                            velX: (Math.random() > 0.5 ? 1 : -1) * (1 + Math.random()),
                            color: '#8B008B',
                            type: 'walker',
                            active: true
                        };
                    } else if (enemyType < 0.8) {
                        // Jumper enemy
                        enemy = {
                            x: 400 + i * 500 + Math.random() * 200,
                            y: this.canvas.height - 140,
                            width: 28,
                            height: 28,
                            velX: (Math.random() > 0.5 ? 1 : -1) * 0.5,
                            velY: 0,
                            color: '#FF4500',
                            type: 'jumper',
                            jumpTimer: 0,
                            onGround: true,
                            active: true
                        };
                    } else {
                        // Flying enemy
                        enemy = {
                            x: 500 + i * 600 + Math.random() * 200,
                            y: 200 + Math.random() * 150,
                            width: 20,
                            height: 20,
                            velX: (Math.random() > 0.5 ? 1 : -1) * 2,
                            velY: Math.sin(Date.now() * 0.001) * 2,
                            color: '#4169E1',
                            type: 'flyer',
                            floatOffset: Math.random() * Math.PI * 2,
                            active: true
                        };
                    }
                    
                    this.enemies.push(enemy);
                }

                // Power-ups
                for (let i = 0; i < 8; i++) {
                    const powerType = Math.random();
                    let powerUp;
                    
                    if (powerType < 0.4) {
                        // Speed boost
                        powerUp = {
                            x: 600 + i * 800 + Math.random() * 300,
                            y: 250 + Math.random() * 200,
                            width: 24,
                            height: 24,
                            type: 'speed',
                            color: '#00FF00',
                            collected: false,
                            bobOffset: Math.random() * Math.PI * 2
                        };
                    } else if (powerType < 0.7) {
                        // Super jump
                        powerUp = {
                            x: 700 + i * 900 + Math.random() * 300,
                            y: 300 + Math.random() * 150,
                            width: 24,
                            height: 24,
                            type: 'jump',
                            color: '#FF1493',
                            collected: false,
                            bobOffset: Math.random() * Math.PI * 2
                        };
                    } else {
                        // Invincibility
                        powerUp = {
                            x: 800 + i * 1000 + Math.random() * 300,
                            y: 200 + Math.random() * 250,
                            width: 24,
                            height: 24,
                            type: 'invincible',
                            color: '#FFD700',
                            collected: false,
                            bobOffset: Math.random() * Math.PI * 2
                        };
                    }
                    
                    this.powerUps.push(powerUp);
                }
            }

            update() {
                if (!this.gameRunning) return;

                // Power-up effects
                if (this.playerPowerUp) {
                    this.powerUpTimer--;
                    if (this.powerUpTimer <= 0) {
                        this.playerPowerUp = null;
                    }
                }

                // Player movement with power-up effects
                const acceleration = 0.5;
                let maxSpeed = 5;
                const friction = 0.85;

                if (this.playerPowerUp === 'speed') {
                    maxSpeed = 8;
                }

                if (this.keys.left) {
                    this.player.velX = Math.max(this.player.velX - acceleration, -maxSpeed);
                } else if (this.keys.right) {
                    this.player.velX = Math.min(this.player.velX + acceleration, maxSpeed);
                } else {
                    this.player.velX *= friction;
                }

                // Better jump handling with super jump power-up
                if (this.keys.jump && this.player.onGround) {
                    let jumpPower = this.player.jumpPower;
                    if (this.playerPowerUp === 'jump') {
                        jumpPower = 20;
                    }
                    this.player.velY = -jumpPower;
                    this.player.onGround = false;
                    this.audioManager.play('jump');
                }

                // Gravity
                this.player.velY += 0.8;

                // Update player position
                this.player.x += this.player.velX;
                this.player.y += this.player.velY;

                // Platform collision
                this.player.onGround = false;
                for (let platform of this.platforms) {
                    if (this.checkCollision(this.player, platform)) {
                        // Landing on top of platform
                        if (this.player.velY > 0 && this.player.y + this.player.height - this.player.velY <= platform.y) {
                            this.player.y = platform.y - this.player.height;
                            this.player.velY = 0;
                            this.player.onGround = true;
                        }
                        // Hitting platform from below
                        else if (this.player.velY < 0 && this.player.y - this.player.velY >= platform.y + platform.height) {
                            this.player.y = platform.y + platform.height;
                            this.player.velY = 0;
                        }
                        // Side collision
                        else if (this.player.velX > 0 && this.player.x - this.player.velX <= platform.x) {
                            this.player.x = platform.x - this.player.width;
                            this.player.velX = 0;
                        }
                        else if (this.player.velX < 0 && this.player.x - this.player.velX >= platform.x + platform.width) {
                            this.player.x = platform.x + platform.width;
                            this.player.velX = 0;
                        }
                    }
                }

                // Ground collision
                if (this.player.y > this.canvas.height - 100 - this.player.height) {
                    this.player.y = this.canvas.height - 100 - this.player.height;
                    this.player.velY = 0;
                    this.player.onGround = true;
                }

                // Collectible collision
                for (let collectible of this.collectibles) {
                    if (!collectible.collected && this.checkCollision(this.player, collectible)) {
                        collectible.collected = true;
                        this.score += 100;
                        this.audioManager.play('collect');
                        document.getElementById('score').textContent = this.score;
                        
                        // Add small particle effect
                        this.createParticles(collectible.x + collectible.width/2, collectible.y + collectible.height/2, collectible.color, 3);
                    }
                }

                // Enhanced enemy movement and collision
                for (let enemy of this.enemies) {
                    if (!enemy.active) continue;

                    if (enemy.type === 'walker') {
                        enemy.x += enemy.velX;

                        // Keep enemies on platforms
                        let onPlatform = false;
                        for (let platform of this.platforms) {
                            if (enemy.x + enemy.width > platform.x && 
                                enemy.x < platform.x + platform.width &&
                                enemy.y + enemy.height >= platform.y && 
                                enemy.y + enemy.height <= platform.y + 20) {
                                onPlatform = true;
                                break;
                            }
                        }

                        if (!onPlatform) {
                            enemy.velX *= -1;
                            enemy.x += enemy.velX * 2;
                        }
                    } 
                    else if (enemy.type === 'jumper') {
                        enemy.x += enemy.velX;
                        enemy.velY += 0.6; // Gravity
                        enemy.y += enemy.velY;
                        
                        // Ground collision for jumpers
                        if (enemy.y > this.canvas.height - 130 - enemy.height) {
                            enemy.y = this.canvas.height - 130 - enemy.height;
                            enemy.velY = 0;
                            enemy.onGround = true;
                        }
                        
                        // Jump randomly
                        enemy.jumpTimer++;
                        if (enemy.jumpTimer > 120 && enemy.onGround && Math.random() < 0.02) {
                            enemy.velY = -12;
                            enemy.onGround = false;
                            enemy.jumpTimer = 0;
                        }
                    }
                    else if (enemy.type === 'flyer') {
                        enemy.x += enemy.velX;
                        enemy.y += Math.sin(Date.now() * 0.005 + enemy.floatOffset) * 1.5;
                        
                        // Reverse direction at boundaries
                        if (enemy.x < 0 || enemy.x > 5000) {
                            enemy.velX *= -1;
                        }
                    }

                    // Player collision with enemy
                    if (this.checkCollision(this.player, enemy)) {
                        if (this.playerPowerUp === 'invincible') {
                            // Destroy enemy if invincible
                            enemy.active = false;
                            this.score += 300;
                            this.audioManager.play('destroy');
                            this.createParticles(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.color);
                            document.getElementById('score').textContent = this.score;
                        }
                        else if (this.player.velY > 0 && this.player.y < enemy.y) {
                            // Player jumped on enemy - destroy enemy and bounce
                            enemy.active = false;
                            this.player.velY = -8;
                            this.score += 200;
                            this.audioManager.play('destroy');
                            this.createParticles(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.color);
                            document.getElementById('score').textContent = this.score;
                        } else {
                            // Player hit enemy - take damage (unless invincible)
                            if (this.playerPowerUp !== 'invincible') {
                                this.playerHit();
                            }
                        }
                    }
                }

                // Update particles
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    let particle = this.particles[i];
                    particle.x += particle.velX;
                    particle.y += particle.velY;
                    particle.velY += 0.3; // Gravity
                    particle.life--;
                    
                    if (particle.life <= 0) {
                        this.particles.splice(i, 1);
                    }
                }

                // Camera follows player
                this.camera.x = this.player.x - this.canvas.width / 2;
                this.camera.y = this.player.y - this.canvas.height / 2;

                // Prevent camera from going too far up or down
                this.camera.y = Math.max(0, Math.min(this.camera.y, 200));

                // Death by falling
                if (this.player.y > this.canvas.height + 100) {
                    this.playerHit();
                }
            }

            checkCollision(rect1, rect2) {
                return rect1.x < rect2.x + rect2.width &&
                       rect1.x + rect1.width > rect2.x &&
                       rect1.y < rect2.y + rect2.height &&
                       rect1.y + rect1.height > rect2.y;
            }

            playerHit() {
                this.lives--;
                this.audioManager.play('hit');
                document.getElementById('lives').textContent = this.lives;

                if (this.lives <= 0) {
                    this.gameOver();
                } else {
                    // Respawn player
                    this.player.x = 100;
                    this.player.y = 400;
                    this.player.velX = 0;
                    this.player.velY = 0;
                }
            }

            gameOver() {
                this.gameRunning = false;
                this.audioManager.play('gameOver');
                document.getElementById('finalScore').textContent = this.score;
                document.getElementById('gameOver').style.display = 'block';
            }

            createParticles(x, y, color, count = 8) {
                for (let i = 0; i < count; i++) {
                    this.particles.push({
                        x: x,
                        y: y,
                        velX: (Math.random() - 0.5) * 8,
                        velY: (Math.random() - 0.5) * 8 - 2,
                        color: color,
                        life: 30 + Math.random() * 20,
                        size: 2 + Math.random() * 3
                    });
                }
            }

            restart() {
                this.player.x = 100;
                this.player.y = 400;
                this.player.velX = 0;
                this.player.velY = 0;
                this.score = 0;
                this.lives = 3;
                this.gameRunning = true;

                // Reset collectibles
                for (let collectible of this.collectibles) {
                    collectible.collected = false;
                }

                // Reset power-ups
                for (let powerUp of this.powerUps) {
                    powerUp.collected = false;
                }

                // Reset enemies
                for (let enemy of this.enemies) {
                    enemy.active = true;
                }

                document.getElementById('score').textContent = this.score;
                document.getElementById('lives').textContent = this.lives;
                document.getElementById('gameOver').style.display = 'none';
            }

            render() {
                // Clear canvas
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // Background gradient
                const gradient = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height);
                gradient.addColorStop(0, '#87CEEB');
                gradient.addColorStop(0.7, '#98FB98');
                gradient.addColorStop(0.7, '#8B4513');
                gradient.addColorStop(1, '#228B22');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.save();
                this.ctx.translate(-this.camera.x, -this.camera.y);

                // Draw platforms
                for (let platform of this.platforms) {
                    this.ctx.fillStyle = platform.color;
                    this.ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                    
                    // Platform highlight
                    this.ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    this.ctx.fillRect(platform.x, platform.y, platform.width, 5);
                }

                // Draw collectibles
                for (let collectible of this.collectibles) {
                    if (collectible.collected) continue;
                    
                    this.ctx.fillStyle = collectible.color;
                    this.ctx.fillRect(collectible.x, collectible.y, collectible.width, collectible.height);
                    
                    // Sparkle effect
                    this.ctx.fillStyle = '#FFF';
                    this.ctx.fillRect(collectible.x + 8, collectible.y + 2, 4, 4);
                    this.ctx.fillRect(collectible.x + 2, collectible.y + 8, 4, 4);
                }

                // Draw enemies with different styles
                for (let enemy of this.enemies) {
                    if (!enemy.active) continue;
                    
                    this.ctx.fillStyle = enemy.color;
                    this.ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                    
                    // Different enemy designs
                    this.ctx.fillStyle = '#FFF';
                    if (enemy.type === 'walker') {
                        // Regular eyes
                        this.ctx.fillRect(enemy.x + 4, enemy.y + 4, 4, 4);
                        this.ctx.fillRect(enemy.x + 16, enemy.y + 4, 4, 4);
                    } else if (enemy.type === 'jumper') {
                        // Angry eyes
                        this.ctx.fillRect(enemy.x + 6, enemy.y + 6, 6, 3);
                        this.ctx.fillRect(enemy.x + 16, enemy.y + 6, 6, 3);
                    } else if (enemy.type === 'flyer') {
                        // Round eyes
                        this.ctx.fillRect(enemy.x + 4, enemy.y + 4, 3, 3);
                        this.ctx.fillRect(enemy.x + 13, enemy.y + 4, 3, 3);
                        // Wings
                        this.ctx.fillStyle = enemy.color;
                        this.ctx.fillRect(enemy.x - 2, enemy.y + 8, 4, 2);
                        this.ctx.fillRect(enemy.x + enemy.width - 2, enemy.y + 8, 4, 2);
                    }
                }

                // Draw player with power-up effects
                if (this.playerPowerUp === 'invincible' && Math.floor(Date.now() / 100) % 2) {
                    this.ctx.fillStyle = '#FFD700';
                } else {
                    this.ctx.fillStyle = this.player.color;
                }
                
                if (this.playerPowerUp === 'speed') {
                    // Speed trail effect
                    this.ctx.globalAlpha = 0.3;
                    this.ctx.fillRect(this.player.x - 5, this.player.y, this.player.width, this.player.height);
                    this.ctx.globalAlpha = 1;
                }
                
                this.ctx.fillRect(this.player.x, this.player.y, this.player.width, this.player.height);
                
                // Player face
                this.ctx.fillStyle = '#FFF';
                this.ctx.fillRect(this.player.x + 8, this.player.y + 8, 4, 4);
                this.ctx.fillRect(this.player.x + 20, this.player.y + 8, 4, 4);
                this.ctx.fillRect(this.player.x + 12, this.player.y + 20, 8, 2);

                this.ctx.restore();
            }

            gameLoop() {
                this.update();
                this.render();
                requestAnimationFrame(() => this.gameLoop());
            }
        }

        // Start the game
        window.addEventListener('load', () => {
            new Game();
        });
    </script>
</body>
</html>
