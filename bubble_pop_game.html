<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Pop Ultimate</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
            height: 100vh;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #gameCanvas {
            display: block;
            background: transparent;
            touch-action: none;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 100;
        }
        
        .ui-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .ui-element {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 16px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            min-width: 120px;
        }
        
        #score { background: linear-gradient(135deg, #667eea, #764ba2); }
        #combo { background: linear-gradient(135deg, #feca57, #ff9ff3); }
        #time { background: linear-gradient(135deg, #f093fb, #f5576c); }
        #level { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        #powerTimer { background: linear-gradient(135deg, #a8edea, #fed6e3); color: #333; }
        
        #startScreen, #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 200;
            max-width: 90vw;
        }
        
        #gameOver { display: none; }
        
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #667eea, #f093fb, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-3px);
        }
        
        .floating-text {
            position: absolute;
            color: white;
            font-weight: 900;
            font-size: 24px;
            pointer-events: none;
            z-index: 150;
            animation: floatUp 1.5s ease-out forwards;
        }
        
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-80px); }
        }
        
        @media (max-width: 600px) {
            #ui { top: 10px; left: 10px; right: 10px; }
            .ui-element { font-size: 14px; padding: 8px 16px; min-width: 100px; }
            h1 { font-size: 32px; }
            #startScreen, #gameOver { padding: 20px; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="startScreen">
            <h1>🫧 Bubble Pop Ultimate</h1>
            <p>Pop bubbles before they reach the bottom!<br>Collect power-ups and build combos for massive scores!</p>
            <button class="btn" onclick="game.start()">Start Game</button>
        </div>
        
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div class="ui-panel">
                <div id="score" class="ui-element">Score: 0</div>
                <div id="combo" class="ui-element">Combo: 0x</div>
            </div>
            <div class="ui-panel">
                <div id="time" class="ui-element">Time: 60</div>
                <div id="level" class="ui-element">Level: 1</div>
                <div id="powerTimer" class="ui-element" style="display: none;">Power: 0s</div>
            </div>
        </div>
        
        <div id="gameOver">
            <h2>Game Over!</h2>
            <div id="finalScore">Score: 0</div>
            <div id="gameStats"></div>
            <button class="btn" onclick="game.restart()">Play Again</button>
        </div>
    </div>

    <script>
        class BubbleGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.setupCanvas();
                this.setupAudio();
                this.setupInput();
                this.reset();
            }
            
            setupCanvas() {
                const resize = () => {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                };
                resize();
                window.addEventListener('resize', resize);
            }
            
            setupAudio() {
                try {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    this.audioEnabled = true;
                } catch (e) {
                    this.audioEnabled = false;
                }
            }
            
            playSound(freq, duration = 0.1) {
                if (!this.audioEnabled) return;
                try {
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.1, this.audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + duration);
                    osc.start();
                    osc.stop(this.audioCtx.currentTime + duration);
                } catch (e) {
                    // Ignore audio errors
                }
            }
            
            setupInput() {
                const handleInput = (e) => {
                    if (!this.running) return;
                    
                    let x, y;
                    if (e.touches) {
                        e.preventDefault();
                        x = e.touches[0].clientX;
                        y = e.touches[0].clientY;
                    } else {
                        x = e.clientX;
                        y = e.clientY;
                    }
                    
                    this.handleClick(x, y);
                };
                
                this.canvas.addEventListener('click', handleInput);
                this.canvas.addEventListener('touchstart', handleInput, { passive: false });
            }
            
            reset() {
                this.score = 0;
                this.combo = 0;
                this.maxCombo = 0;
                this.level = 1;
                this.timeLeft = 60;
                this.bubbles = [];
                this.powerUps = [];
                this.particles = [];
                this.running = false;
                this.powerUpActive = null;
                this.powerUpTimer = 0;
                this.bubblesPopped = 0;
                this.scoreMultiplier = 1;
                
                this.bubbleTypes = {
                    normal: { color: '#4ECDC4', points: 10, radius: 25 },
                    gold: { color: '#FFD700', points: 50, radius: 30 },
                    rainbow: { color: '#FF69B4', points: 30, radius: 25 },
                    giant: { color: '#FF6B6B', points: 100, radius: 45 },
                    speed: { color: '#32CD32', points: 25, radius: 20 }
                };
                
                this.powerUpTypes = {
                    freeze: { color: '#74b9ff', name: 'FREEZE', duration: 5 },
                    double: { color: '#fd79a8', name: '2X SCORE', duration: 8 },
                    bomb: { color: '#ff7675', name: 'BOMB', duration: 0 },
                    slow: { color: '#fdcb6e', name: 'SLOW MO', duration: 6 }
                };
                
                this.updateUI();
            }
            
            start() {
                document.getElementById('startScreen').style.display = 'none';
                this.reset();
                this.running = true;
                
                // Resume audio context
                if (this.audioEnabled && this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }
                
                // Start timers
                this.gameTimer = setInterval(() => {
                    this.timeLeft--;
                    if (this.timeLeft <= 0) {
                        this.end();
                    } else {
                        this.updateUI();
                        
                        // Level up every 10 seconds
                        if (this.timeLeft % 10 === 0) {
                            this.level++;
                            this.showFloatingText(this.canvas.width / 2, this.canvas.height / 2, 
                                `Level ${this.level}!`, '#4facfe');
                        }
                    }
                }, 1000);
                
                this.bubbleTimer = setInterval(() => {
                    this.spawnBubble();
                }, Math.max(300, 1000 - this.level * 30));
                
                this.powerUpTimer = setInterval(() => {
                    if (Math.random() < 0.3) {
                        this.spawnPowerUp();
                    }
                }, 8000);
                
                this.gameLoop();
            }
            
            spawnBubble() {
                if (!this.running) return;
                
                let type = 'normal';
                const rand = Math.random();
                
                if (rand < 0.02) type = 'giant';
                else if (rand < 0.05) type = 'gold';
                else if (rand < 0.08) type = 'rainbow';
                else if (rand < 0.12) type = 'speed';
                
                const config = this.bubbleTypes[type];
                const bubble = {
                    id: Date.now() + Math.random(),
                    x: Math.random() * (this.canvas.width - config.radius * 2) + config.radius,
                    y: -config.radius,
                    radius: config.radius + Math.random() * 10 - 5,
                    speed: (1 + this.level * 0.1) * (type === 'speed' ? 2 : type === 'giant' ? 0.7 : 1),
                    type: type,
                    color: config.color,
                    wobble: Math.random() * 0.02,
                    wobbleOffset: Math.random() * Math.PI * 2,
                    frozen: false
                };
                
                this.bubbles.push(bubble);
            }
            
            spawnPowerUp() {
                if (!this.running) return;
                
                const types = Object.keys(this.powerUpTypes);
                const type = types[Math.floor(Math.random() * types.length)];
                const config = this.powerUpTypes[type];
                
                const powerUp = {
                    id: Date.now() + Math.random(),
                    x: Math.random() * (this.canvas.width - 60) + 30,
                    y: -30,
                    radius: 25,
                    speed: 1,
                    type: type,
                    color: config.color,
                    name: config.name,
                    duration: config.duration
                };
                
                this.powerUps.push(powerUp);
            }
            
            handleClick(x, y) {
                let hit = false;
                
                // Check power-ups first
                for (let i = this.powerUps.length - 1; i >= 0; i--) {
                    const powerUp = this.powerUps[i];
                    const dist = Math.sqrt((x - powerUp.x) ** 2 + (y - powerUp.y) ** 2);
                    
                    if (dist < powerUp.radius) {
                        this.collectPowerUp(powerUp, i);
                        hit = true;
                        break;
                    }
                }
                
                // Check bubbles
                if (!hit) {
                    for (let i = this.bubbles.length - 1; i >= 0; i--) {
                        const bubble = this.bubbles[i];
                        const dist = Math.sqrt((x - bubble.x) ** 2 + (y - bubble.y) ** 2);
                        
                        if (dist < bubble.radius) {
                            this.popBubble(bubble, i, x, y);
                            hit = true;
                            break;
                        }
                    }
                }
                
                if (!hit) {
                    this.combo = Math.max(0, this.combo - 1);
                    this.updateUI();
                }
            }
            
            popBubble(bubble, index, x, y) {
                const basePoints = this.bubbleTypes[bubble.type].points;
                const points = Math.floor(basePoints * this.scoreMultiplier * (1 + this.combo * 0.1));
                
                this.score += points;
                this.combo++;
                this.maxCombo = Math.max(this.maxCombo, this.combo);
                this.bubblesPopped++;
                
                // Remove bubble
                this.bubbles.splice(index, 1);
                
                // Effects
                this.createParticles(bubble.x, bubble.y, bubble.color, 15);
                this.showFloatingText(x, y, `+${points}`, '#FFD700');
                
                if (this.combo >= 10) {
                    this.showFloatingText(x, y - 40, `${this.combo}x COMBO!`, '#FF69B4');
                }
                
                // Handle special bubbles
                if (bubble.type === 'giant') {
                    this.createShockwave(bubble.x, bubble.y);
                } else if (bubble.type === 'gold') {
                    this.score += 200;
                    this.createParticles(bubble.x, bubble.y, '#FFD700', 25);
                }
                
                // Sound
                const pitch = 400 + this.combo * 50 + (bubble.type === 'gold' ? 200 : 0);
                this.playSound(pitch);
                
                this.updateUI();
            }
            
            createShockwave(x, y) {
                // Pop nearby bubbles
                for (let i = this.bubbles.length - 1; i >= 0; i--) {
                    const other = this.bubbles[i];
                    const dist = Math.sqrt((x - other.x) ** 2 + (y - other.y) ** 2);
                    if (dist < 120) {
                        this.popBubble(other, i, other.x, other.y);
                    }
                }
                
                // Visual effect
                this.createParticles(x, y, '#FF6B6B', 30);
            }
            
            collectPowerUp(powerUp, index) {
                this.powerUps.splice(index, 1);
                this.activatePowerUp(powerUp.type, powerUp.duration);
                this.createParticles(powerUp.x, powerUp.y, powerUp.color, 20);
                this.showFloatingText(powerUp.x, powerUp.y, powerUp.name, powerUp.color);
                this.playSound(800);
            }
            
            activatePowerUp(type, duration) {
                this.powerUpActive = type;
                this.powerUpTimer = duration;
                
                switch (type) {
                    case 'freeze':
                        this.bubbles.forEach(b => b.frozen = true);
                        break;
                    case 'double':
                        this.scoreMultiplier = 2;
                        break;
                    case 'bomb':
                        this.explodeAllBubbles();
                        return; // No timer needed
                    case 'slow':
                        this.bubbles.forEach(b => b.speed *= 0.3);
                        break;
                }
                
                // Start power-up countdown
                if (duration > 0) {
                    document.getElementById('powerTimer').style.display = 'block';
                    
                    const countdown = setInterval(() => {
                        this.powerUpTimer--;
                        document.getElementById('powerTimer').textContent = `${this.powerUpActive.toUpperCase()}: ${this.powerUpTimer}s`;
                        
                        if (this.powerUpTimer <= 0) {
                            this.deactivatePowerUp(type);
                            clearInterval(countdown);
                        }
                    }, 1000);
                }
            }
            
            deactivatePowerUp(type) {
                switch (type) {
                    case 'freeze':
                        this.bubbles.forEach(b => b.frozen = false);
                        break;
                    case 'double':
                        this.scoreMultiplier = 1;
                        break;
                    case 'slow':
                        this.bubbles.forEach(b => b.speed /= 0.3);
                        break;
                }
                
                this.powerUpActive = null;
                document.getElementById('powerTimer').style.display = 'none';
            }
            
            explodeAllBubbles() {
                const bubblesToPop = [...this.bubbles];
                this.bubbles = [];
                
                bubblesToPop.forEach((bubble, i) => {
                    setTimeout(() => {
                        const points = this.bubbleTypes[bubble.type].points;
                        this.score += points;
                        this.createParticles(bubble.x, bubble.y, bubble.color, 10);
                        this.playSound(400 + i * 20);
                    }, i * 50);
                });
                
                this.bubblesPopped += bubblesToPop.length;
                this.updateUI();
            }
            
            createParticles(x, y, color, count) {
                for (let i = 0; i < count; i++) {
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 15,
                        vy: (Math.random() - 0.5) * 15,
                        life: 60,
                        maxLife: 60,
                        color: color,
                        size: Math.random() * 6 + 2
                    });
                }
            }
            
            showFloatingText(x, y, text, color) {
                const element = document.createElement('div');
                element.className = 'floating-text';
                element.textContent = text;
                element.style.left = (x - 50) + 'px';
                element.style.top = y + 'px';
                element.style.color = color;
                
                document.getElementById('gameContainer').appendChild(element);
                setTimeout(() => element.remove(), 1500);
            }
            
            update() {
                if (!this.running) return;
                
                // Update bubbles
                for (let i = this.bubbles.length - 1; i >= 0; i--) {
                    const bubble = this.bubbles[i];
                    
                    if (!bubble.frozen) {
                        bubble.y += bubble.speed;
                        bubble.wobbleOffset += bubble.wobble;
                        bubble.x += Math.sin(bubble.wobbleOffset) * 0.5;
                    }
                    
                    // Remove escaped bubbles
                    if (bubble.y > this.canvas.height + bubble.radius) {
                        this.bubbles.splice(i, 1);
                        if (this.combo > 0) {
                            this.combo = Math.max(0, this.combo - 2);
                            this.updateUI();
                        }
                    }
                }
                
                // Update power-ups
                for (let i = this.powerUps.length - 1; i >= 0; i--) {
                    const powerUp = this.powerUps[i];
                    powerUp.y += powerUp.speed;
                    
                    if (powerUp.y > this.canvas.height + powerUp.radius) {
                        this.powerUps.splice(i, 1);
                    }
                }
                
                // Update particles
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const particle = this.particles[i];
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.vy += 0.5; // gravity
                    particle.vx *= 0.98; // air resistance
                    particle.life--;
                    
                    if (particle.life <= 0) {
                        this.particles.splice(i, 1);
                    }
                }
                
                // Limit particles for performance
                if (this.particles.length > 200) {
                    this.particles = this.particles.slice(-150);
                }
            }
            
            render() {
                // Clear canvas
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Draw bubbles
                this.bubbles.forEach(bubble => {
                    this.ctx.save();
                    
                    // Shadow
                    this.ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                    this.ctx.shadowBlur = 15;
                    this.ctx.shadowOffsetY = 5;
                    
                    // Bubble gradient
                    const gradient = this.ctx.createRadialGradient(
                        bubble.x - bubble.radius * 0.3, bubble.y - bubble.radius * 0.3, 0,
                        bubble.x, bubble.y, bubble.radius
                    );
                    
                    if (bubble.type === 'rainbow') {
                        const hue = (Date.now() * 0.1) % 360;
                        gradient.addColorStop(0, `hsl(${hue}, 70%, 70%)`);
                        gradient.addColorStop(0.5, `hsl(${(hue + 60) % 360}, 70%, 60%)`);
                        gradient.addColorStop(1, `hsl(${(hue + 120) % 360}, 70%, 50%)`);
                    } else {
                        gradient.addColorStop(0, bubble.color);
                        gradient.addColorStop(0.7, bubble.color);
                        gradient.addColorStop(1, 'rgba(255, 255, 255, 0.3)');
                    }
                    
                    // Draw bubble
                    this.ctx.fillStyle = gradient;
                    this.ctx.beginPath();
                    this.ctx.arc(bubble.x, bubble.y, bubble.radius, 0, Math.PI * 2);
                    this.ctx.fill();
                    
                    // Highlight
                    this.ctx.shadowColor = 'transparent';
                    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                    this.ctx.beginPath();
                    this.ctx.arc(
                        bubble.x - bubble.radius * 0.3, 
                        bubble.y - bubble.radius * 0.3, 
                        bubble.radius * 0.3, 
                        0, Math.PI * 2
                    );
                    this.ctx.fill();
                    
                    // Special effects
                    if (bubble.frozen) {
                        this.ctx.strokeStyle = '#74b9ff';
                        this.ctx.lineWidth = 3;
                        this.ctx.beginPath();
                        this.ctx.arc(bubble.x, bubble.y, bubble.radius + 5, 0, Math.PI * 2);
                        this.ctx.stroke();
                    }
                    
                    this.ctx.restore();
                });
                
                // Draw power-ups
                this.powerUps.forEach(powerUp => {
                    this.ctx.save();
                    
                    // Glow effect
                    this.ctx.shadowColor = powerUp.color;
                    this.ctx.shadowBlur = 20;
                    
                    // Power-up body
                    const gradient = this.ctx.createRadialGradient(
                        powerUp.x, powerUp.y, 0,
                        powerUp.x, powerUp.y, powerUp.radius
                    );
                    gradient.addColorStop(0, '#FFFFFF');
                    gradient.addColorStop(0.5, powerUp.color);
                    gradient.addColorStop(1, powerUp.color);
                    
                    this.ctx.fillStyle = gradient;
                    this.ctx.beginPath();
                    this.ctx.arc(powerUp.x, powerUp.y, powerUp.radius, 0, Math.PI * 2);
                    this.ctx.fill();
                    
                    // Icon
                    this.ctx.shadowColor = 'transparent';
                    this.ctx.fillStyle = '#FFFFFF';
                    this.ctx.font = 'bold 16px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    
                    let icon = '⚡';
                    if (powerUp.type === 'freeze') icon = '❄️';
                    else if (powerUp.type === 'bomb') icon = '💣';
                    else if (powerUp.type === 'slow') icon = '🐌';
                    
                    this.ctx.fillText(icon, powerUp.x, powerUp.y);
                    
                    this.ctx.restore();
                });
                
                // Draw particles
                this.particles.forEach(particle => {
                    const alpha = particle.life / particle.maxLife;
                    this.ctx.save();
                    this.ctx.globalAlpha = alpha;
                    this.ctx.fillStyle = particle.color;
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                });
            }
            
            gameLoop() {
                if (!this.running) return;
                
                this.update();
                this.render();
                requestAnimationFrame(() => this.gameLoop());
            }
            
            updateUI() {
                document.getElementById('score').textContent = `Score: ${this.score.toLocaleString()}`;
                document.getElementById('combo').textContent = `Combo: ${this.combo}x`;
                document.getElementById('time').textContent = `Time: ${this.timeLeft}`;
                document.getElementById('level').textContent = `Level: ${this.level}`;
            }
            
            end() {
                this.running = false;
                
                // Clear timers
                clearInterval(this.gameTimer);
                clearInterval(this.bubbleTimer);
                clearInterval(this.powerUpTimer);
                
                // Show game over screen
                const accuracy = this.bubblesPopped > 0 ? 
                    Math.round((this.bubblesPopped / (this.bubblesPopped + this.bubbles.length)) * 100) : 0;
                
                document.getElementById('finalScore').textContent = `Final Score: ${this.score.toLocaleString()}`;
                document.getElementById('gameStats').innerHTML = `
                    <div style="margin: 20px 0; padding: 20px; background: rgba(255,255,255,0.1); border-radius: 10px;">
                        <div>Bubbles Popped: ${this.bubblesPopped}</div>
                        <div>Max Combo: ${this.maxCombo}x</div>
                        <div>Level Reached: ${this.level}</div>
                        <div>Accuracy: ${accuracy}%</div>
                    </div>
                `;
                
                document.getElementById('gameOver').style.display = 'block';
                
                // Game over sound
                this.playSound(200, 0.5);
            }
            
            restart() {
                document.getElementById('gameOver').style.display = 'none';
                
                // Clean up any floating elements
                document.querySelectorAll('.floating-text').forEach(el => el.remove());
                
                this.start();
            }
        }
        
        // Initialize game
        const game = new BubbleGame();
    </script>
</body>
</html>
