<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimCity Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .hud {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .resource {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 20px;
        }

        .city-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 2px;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            margin: 10px;
            border-radius: 15px;
        }

        .cell {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            border: 2px solid #16a085;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 8px;
            min-height: 40px;
            position: relative;
        }

        .cell:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .cell:active {
            transform: scale(0.95);
        }

        .cell.residential {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            border-color: #1abc9c;
        }

        .cell.commercial {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            border-color: #d35400;
        }

        .cell.industrial {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            border-color: #a93226;
        }

        .cell.road {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
            border-color: #566573;
        }

        .cell.park {
            background: linear-gradient(135deg, #00b894 0%, #00a085 100%);
            border-color: #00695c;
        }

        .level-indicator {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: bold;
        }

        .toolbar {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tool-btn {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            min-width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .tool-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .tool-btn.active {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            transform: scale(1.1);
        }

        .tool-cost {
            font-size: 10px;
            opacity: 0.8;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            font-weight: bold;
            transform: translateX(400px);
            transition: transform 0.3s;
            z-index: 1000;
            max-width: 280px;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .notification.warning {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .control-btn {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .control-btn:hover {
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .city-grid {
                grid-template-columns: repeat(6, 1fr);
                grid-template-rows: repeat(6, 1fr);
                padding: 10px;
                margin: 5px;
            }

            .hud {
                padding: 10px;
                font-size: 14px;
            }

            .resource {
                font-size: 14px;
                padding: 6px 10px;
            }

            .tool-btn {
                padding: 10px 12px;
                font-size: 12px;
                min-width: 70px;
            }

            .cell {
                font-size: 24px;
                min-height: 35px;
            }
        }

        @media (max-width: 480px) {
            .city-grid {
                grid-template-columns: repeat(5, 1fr);
                grid-template-rows: repeat(5, 1fr);
            }

            .tool-btn {
                min-width: 60px;
                font-size: 11px;
            }

            .cell {
                font-size: 20px;
                min-height: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="hud">
            <div class="resource">
                💰 <span id="money">10000</span>
            </div>
            <div class="resource">
                👥 <span id="population">0</span>
            </div>
            <div class="resource">
                😊 <span id="happiness">100</span>
            </div>
            <div class="controls">
                <button class="control-btn" onclick="toggleSound()" id="soundBtn">🔊</button>
                <button class="control-btn" onclick="togglePause()" id="pauseBtn">⏸️</button>
            </div>
        </div>

        <div class="city-grid" id="cityGrid"></div>

        <div class="toolbar">
            <button class="tool-btn" onclick="selectTool('residential')">
                🏠<br><span class="tool-cost">$150</span>
            </button>
            <button class="tool-btn" onclick="selectTool('commercial')">
                🏪<br><span class="tool-cost">$300</span>
            </button>
            <button class="tool-btn" onclick="selectTool('industrial')">
                🏭<br><span class="tool-cost">$500</span>
            </button>
            <button class="tool-btn" onclick="selectTool('road')">
                🛣️<br><span class="tool-cost">$100</span>
            </button>
            <button class="tool-btn" onclick="selectTool('park')">
                🌳<br><span class="tool-cost">$250</span>
            </button>
            <button class="tool-btn" onclick="selectTool('bulldozer')">
                🚜<br><span class="tool-cost">Free</span>
            </button>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        // Simple game state
        const game = {
            money: 10000,
            population: 0,
            happiness: 100,
            selectedTool: 'residential',
            soundEnabled: true,
            isPaused: false,
            grid: [],
            gridSize: 8
        };

        // Building definitions
        const buildings = {
            residential: { cost: 150, emoji: '🏠', pop: 8, happiness: 2, income: 4 },
            commercial: { cost: 300, emoji: '🏪', pop: 4, happiness: 3, income: 8 },
            industrial: { cost: 500, emoji: '🏭', pop: 12, happiness: -2, income: 12 },
            road: { cost: 100, emoji: '🛣️', pop: 0, happiness: 3, income: 0 },
            park: { cost: 250, emoji: '🌳', pop: 0, happiness: 8, income: -1 }
        };

        // Initialize game
        function initGame() {
            const isMobile = window.innerWidth <= 768;
            game.gridSize = isMobile ? (window.innerWidth <= 480 ? 5 : 6) : 8;
            
            const grid = document.getElementById('cityGrid');
            grid.style.gridTemplateColumns = `repeat(${game.gridSize}, 1fr)`;
            grid.style.gridTemplateRows = `repeat(${game.gridSize}, 1fr)`;
            grid.innerHTML = '';
            
            game.grid = [];
            
            for (let i = 0; i < game.gridSize * game.gridSize; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.onclick = () => handleCellClick(i);
                grid.appendChild(cell);
                game.grid.push(null);
            }
            
            selectTool('residential');
            updateDisplay();
        }

        // Handle cell clicks
        function handleCellClick(index) {
            const cell = document.querySelector('.city-grid').children[index];
            const currentBuilding = game.grid[index];

            if (game.selectedTool === 'bulldozer') {
                if (currentBuilding) {
                    demolish(index, cell);
                } else {
                    showNotification('Nothing to demolish!', 'warning');
                }
                return;
            }

            if (currentBuilding) {
                showNotification('Cell occupied! Use bulldozer first.', 'warning');
                return;
            }

            const building = buildings[game.selectedTool];
            if (game.money < building.cost) {
                showNotification(`Need $${building.cost}!`, 'error');
                return;
            }

            build(index, cell, game.selectedTool);
        }

        // Build function
        function build(index, cell, type) {
            const building = buildings[type];
            
            game.money -= building.cost;
            game.grid[index] = type;
            
            cell.className = `cell ${type}`;
            cell.textContent = building.emoji;
            
            playSound('build');
            showNotification(`Built ${type}! -$${building.cost}`, 'success');
            updateStats();
        }

        // Demolish function
        function demolish(index, cell) {
            const type = game.grid[index];
            const building = buildings[type];
            const refund = Math.floor(building.cost * 0.5);
            
            game.money += refund;
            game.grid[index] = null;
            
            cell.className = 'cell';
            cell.textContent = '';
            
            playSound('demolish');
            showNotification(`Demolished ${type}! +$${refund}`, 'success');
            updateStats();
        }

        // Update statistics
        function updateStats() {
            let totalPop = 0;
            let totalHappiness = 100;
            let totalIncome = 0;

            game.grid.forEach(buildingType => {
                if (buildingType) {
                    const building = buildings[buildingType];
                    totalPop += building.pop;
                    totalHappiness += building.happiness;
                    totalIncome += building.income;
                }
            });

            // Clamp happiness
            totalHappiness = Math.max(0, Math.min(100, totalHappiness));

            game.population = totalPop;
            game.happiness = totalHappiness;

            updateDisplay();

            // Generate income
            if (totalIncome > 0 && !game.isPaused) {
                setTimeout(() => {
                    game.money += totalIncome;
                    updateDisplay();
                }, 1000);
            }
        }

        // Update display
        function updateDisplay() {
            document.getElementById('money').textContent = game.money;
            document.getElementById('population').textContent = game.population;
            document.getElementById('happiness').textContent = game.happiness;
        }

        // Tool selection
        function selectTool(tool) {
            game.selectedTool = tool;
            
            // Remove active class from all buttons
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Find and activate the correct button
            const buttons = document.querySelectorAll('.tool-btn');
            buttons.forEach(btn => {
                const btnText = btn.textContent.toLowerCase();
                if ((tool === 'residential' && btnText.includes('🏠')) ||
                    (tool === 'commercial' && btnText.includes('🏪')) ||
                    (tool === 'industrial' && btnText.includes('🏭')) ||
                    (tool === 'road' && btnText.includes('🛣️')) ||
                    (tool === 'park' && btnText.includes('🌳')) ||
                    (tool === 'bulldozer' && btnText.includes('🚜'))) {
                    btn.classList.add('active');
                }
            });
            
            const building = buildings[tool];
            if (building) {
                showNotification(`Selected: ${tool} (${building.cost})`, 'success');
            } else {
                showNotification('Bulldozer selected', 'success');
            }
            
            playSound('build');
        }

        // Sound system
        function playSound(type) {
            if (!game.soundEnabled) return;
            
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                const frequencies = {
                    build: 800,
                    demolish: 400,
                    error: 200
                };
                
                oscillator.frequency.value = frequencies[type] || 600;
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.3);
            } catch (e) {
                // Audio not supported
            }
        }

        // Notification system
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Control functions
        function toggleSound() {
            game.soundEnabled = !game.soundEnabled;
            const btn = document.getElementById('soundBtn');
            btn.textContent = game.soundEnabled ? '🔊' : '🔇';
            showNotification(game.soundEnabled ? 'Sound On' : 'Sound Off', 'success');
        }

        function togglePause() {
            game.isPaused = !game.isPaused;
            const btn = document.getElementById('pauseBtn');
            btn.textContent = game.isPaused ? '▶️' : '⏸️';
            showNotification(game.isPaused ? 'Game Paused' : 'Game Resumed', 'success');
        }

        // Auto-income timer
        setInterval(() => {
            if (!game.isPaused && game.population > 0) {
                const income = Math.floor(game.population * 0.5);
                game.money += income;
                updateDisplay();
            }
        }, 5000);

        // Prevent zoom on mobile
        document.addEventListener('touchend', (event) => {
            const now = Date.now();
            if (now - (window.lastTouchEnd || 0) <= 300) {
                event.preventDefault();
            }
            window.lastTouchEnd = now;
        }, false);

        // Initialize on load
        window.addEventListener('load', initGame);
        window.addEventListener('resize', initGame);

        // Keyboard shortcuts
        document.addEventListener('keydown', (event) => {
            switch(event.key) {
                case '1': selectTool('residential'); break;
                case '2': selectTool('commercial'); break;
                case '3': selectTool('industrial'); break;
                case '4': selectTool('road'); break;
                case '5': selectTool('park'); break;
                case 'd': 
                case 'D': selectTool('bulldozer'); break;
                case ' ': 
                    event.preventDefault(); 
                    togglePause(); 
                    break;
                case 'm': 
                case 'M': toggleSound(); break;
            }
        });
    </script>
</body>
</html>
